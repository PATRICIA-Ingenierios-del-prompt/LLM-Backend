apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.name }}-secrets
    creationPolicy: Owner
  data:
    # Raw Groq API key stored as a plain-string secret (like patricia-dev/jwt-secret).
    - secretKey: GROQ_API_KEY
      remoteRef:
        key: {{ .Values.externalSecret.groqRemoteKey }}
    # Neon Postgres connection (real persistence for diary entries + exercise
    # completions). Same ESO pattern as the Groq key above.
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: {{ .Values.externalSecret.dbUrlRemoteKey }}
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.dbUsernameRemoteKey }}
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.dbPasswordRemoteKey }}
