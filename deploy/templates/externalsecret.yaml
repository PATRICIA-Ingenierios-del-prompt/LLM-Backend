apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.name }}-secrets
    creationPolicy: Owner
  data:
    # Raw Groq API key stored as a plain-string secret (like patricia-dev/jwt-secret).
    - secretKey: GROQ_API_KEY
      remoteRef:
        key: {{ .Values.externalSecret.groqRemoteKey }}
    # Neon Postgres connection (real persistence for diary entries + exercise
    # completions). This is ONE secret in AWS Secrets Manager holding all 3
    # properties as a JSON blob (same multi-property pattern as the Redis
    # backplane secrets in other services) -- not three separate secrets.
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: {{ .Values.externalSecret.dbRemoteKey }}
        property: SPRING_DATASOURCE_URL
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.dbRemoteKey }}
        property: SPRING_DATASOURCE_USERNAME
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.dbRemoteKey }}
        property: SPRING_DATASOURCE_PASSWORD
