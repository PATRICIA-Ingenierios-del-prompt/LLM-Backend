name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  id-token: write        # required for AWS OIDC (push-image, deploy)
  pull-requests: read

env:
  IMAGE_NAME: patricia-dev/wellbeing
  HELM_RELEASE: wellbeing
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build, test & coverage
        run: mvn -B clean verify

  push-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Compute short SHA tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push image (linux/amd64)
        run: |
          docker build --platform=linux/amd64 \
            -t "$ECR_REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.tag }}" \
            -t "$ECR_REGISTRY/$IMAGE_NAME:latest" .
          docker push "$ECR_REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.tag }}"
          docker push "$ECR_REGISTRY/$IMAGE_NAME:latest"

  deploy:
    needs: push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set up kubectl + Helm
        uses: azure/setup-helm@v4
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Helm upgrade --install
        run: |
          helm upgrade "$HELM_RELEASE" ./deploy --install \
            -n patricia-app \
            --set image.repository="$ECR_REGISTRY/$IMAGE_NAME" \
            --set image.tag="${{ needs.push-image.outputs.image_tag }}" \
            --wait --timeout 8m
      - name: Smoke check
        run: kubectl rollout status deploy/wellbeing -n patricia-app --timeout=120s
