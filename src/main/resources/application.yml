spring:
  main:
    banner-mode: off
    web-application-type: servlet
  application:
    name: Bienestar Estudiantil
  # Real persistence (Neon Postgres) for diary entries and exercise completions.
  # Locally, point these at a Neon dev branch via a .env file (same pattern as
  # GROQ_API_KEY). The localhost default is just a fallback and requires a local
  # Postgres to actually connect.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wellbeing}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates the entity mapping matches.
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8086

logging:
  level:
    com.bienestar: INFO

# Actuator: expose only health. Enable the liveness/readiness probe groups so
# Kubernetes probes hit /actuator/health/liveness and /actuator/health/readiness.
# The custom WellbeingHealthIndicator (component below) contributes to readiness,
# so a pod with no working LLM (missing GROQ_API_KEY) is reported NOT ready
# instead of silently serving degraded 200s.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          # "db" is auto-contributed by Spring Boot once a DataSource bean exists.
          # Fail readiness loudly if Neon isn't reachable, same "fail loudly"
          # philosophy as the "wellbeing" (LLM) indicator below.
          include: readinessState,wellbeing,db
      show-details: never
